<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AERO-PROPULSION 3D STL Interactive Studio</title>
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; color: #00f0ff; font-family: 'Consolas', monospace; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #hud { position: absolute; top: 15px; left: 20px; background: rgba(10, 16, 26, 0.85); border: 1px solid #00f0ff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,240,255,0.2); pointer-events: auto; }
        h1 { margin: 0 0 5px 0; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .meta { font-size: 12px; color: #88a0c0; margin-bottom: 15px; }
        .stat-grid { display: grid; grid-template-columns: 1f 1f; gap: 10px; font-size: 12px; }
        .stat-val { color: #00ffaa; font-weight: bold; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        button { background: #002b3d; color: #00f0ff; border: 1px solid #00f0ff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; transition: all 0.2s; }
        button:hover { background: #00f0ff; color: #000; box-shadow: 0 0 10px #00f0ff; }
        #instructions { position: absolute; bottom: 15px; right: 20px; font-size: 11px; color: #557088; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@00.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@00.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="hud">
        <h1>🙸 CubeSat Thruster Studio</h1>
        <div class="meta">Lead Architect: <b>Md Mushfiqur Rahim</b></div>
        <div class="stat-grid">
            <div>Thrust: <span class="stat-val">1.0 N</span></div>
            <div>Pressure (Pc): <span class="stat-val">15.0 bar</span></div>
            <div>Isp (Vacuum): <span class="stat-val">212.7 s</span></div>
            <div>Exhaust Vel: <span class="stat-val">2,086 m/s</span></div>
            <div>Flange Collar: <span class="stat-val">11.0 mm OD</span></div>
            <div>Material: <span class="stat-val">316L QS/SS</span></div>
        </div>
        <div class="btn-group">
            <button onclick="loadModel('cubesat_thruster.stl')">Reload Model</button>
            <button onclick="toggleWireframe()">Toggle Wireframe</button>
            <button onclick="resetView()">Reset Camera</button>
        </div>
    </div>
    <div id="instructions">🖱ￏ Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, currentMesh;
        let isWireframe = false;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);

            const gridHelper = new THREE.GridHelper(60, 60, 0x00f0ff, 0x1f2d3d);
            gridHelper.position.y = -10;
            scene.add(gridHelper);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(35, 25, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 2.5);
            dirLight1.position.set(50, 50, 50);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xff6600, 1.5);
            dirLight2.position.set(-50, -30, -50);
            scene.add(dirLight2);

            loadModel('cubesat_thruster.stl');

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function loadModel(filename) {
            const loader = new THREE.STLLoader();
            loader.load(filename, function (geometry) {
                if (currentMesh) scene.remove(currentMesh);
                geometry.center();
                const material = new THREE.MeshStandardMaterial({
                    color: 0x90a4ae,
                    metalness: 0.85,
                    roughness: 0.25,
                    wireframe: isWireframe
                });
                currentMesh = new THREE.Mesh(geometry, material);
                currentMesh.scale.set(1.5, 1.5, 1.5);
                currentMesh.rotation.z = Math.PI / 2;
                scene.add(currentMesh);
            });
        }


        function toggleWireframe() {
            isWireframe = !isWireframe;
            if (currentMesh) currentMesh.material.wireframe = isWireframe;
        }

        function resetView() {
            camera.position.set(35, 25, 45);
            controls.target.set(0, 0, 0);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }


        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
